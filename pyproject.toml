[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawbridge"
version = "0.1.0"
description = "Build-time Lean law checks for actual Python executions"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lawbridge = "lawbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
